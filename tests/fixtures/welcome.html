<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QA Practice — Welcome</title>
</head>
<body>
  <h1>Welcome, Tester</h1>
  <button id="greet">Say hello</button>
  <p id="message" role="status"></p>

  <script>
    document.getElementById('greet').addEventListener('click', () => {
      document.getElementById('message').textContent = 'Hello from Playwright!';
    });
  </script>
</body>
</html>
